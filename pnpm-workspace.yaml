packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - "@types/node@22.20.2"
overrides:
  sharp: ^0.35.4
allowBuilds:
  "@google/genai": false
  protobufjs: false
  browser-tabs-lock: false
  core-js: false
  core-js-pure: false
  esbuild: true
  fsevents: true
  lefthook: true
  workerd: true
  # just-bash's optional compressors (agents/skills imports it); the Coder never runs a skill script.
  "@mongodb-js/zstd": false
  node-liblzma: false
