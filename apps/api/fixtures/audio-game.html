<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <title>Audio fixture</title>
  </head>
  <body style="margin: 0">
    <!-- hopon:runtime v1 -->
    <script>
      // PROTOTYPE fixture: tap the screen; each tap plays a ZzFX blip. HUE is replaced per seeded copy.
      const HUE = 0.55;
      let taps = 0;
      engineInit(
        () => {},
        () => {
          if (mouseWasPressed(0)) {
            taps++;
            zzfx(...[, , 537, 0.02, 0.02, 0.22, 1, 1.59, -6.98, 4.97]);
            window.hoponReport?.("sfx", { taps });
          }
        },
        () => {},
        () => {
          drawRect(cameraPos, vec2(100), hsl(HUE, 0.6, 0.25));
          drawCircle(
            vec2(Math.sin(time) * 3, Math.cos(time * 1.3) * 3),
            3,
            hsl(HUE, 0.8, 0.6)
          );
        },
        () => {
          drawTextScreen(`taps ${taps}`, vec2(mainCanvasSize.x / 2, 60), 40);
          drawTextScreen(
            "tap for sound",
            vec2(mainCanvasSize.x / 2, mainCanvasSize.y - 60),
            28
          );
        }
      );
    </script>
  </body>
</html>
