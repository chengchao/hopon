# Calls node_modules/.bin directly: pnpm 11.5.2 has no native binary for Intel Macs.
# Vendored Clerk skills and generated files are left exactly as their tools wrote them.
pre-commit:
  parallel: true
  exclude:
    - '.agents/**'
    - '.claude/**'
    - 'migrations/**'
    - 'worker/worker-configuration.d.ts'
    - 'skills-lock.json'
  commands:
    lint:
      glob: '*.{js,cjs,ts,tsx}'
      run: node_modules/.bin/oxlint {staged_files}
    format:
      glob: '*.{js,cjs,ts,tsx,json,jsonc,css,md,yml}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}
