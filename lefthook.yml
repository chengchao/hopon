# Calls node_modules/.bin directly so hooks don't depend on how pnpm is installed.
# Vendored Clerk skills, vendored repos/, and generated files are left exactly as their tools wrote them.
pre-commit:
  exclude:
    - ".agents/**"
    - ".claude/**"
    - "repos/**"
    - "**/migrations/**"
    - "**/worker-configuration.d.ts"
    - "skills-lock.json"
  commands:
    fix:
      glob: "*.{js,cjs,ts,tsx,json,jsonc,css,md,yml}"
      run: node_modules/.bin/ultracite fix {staged_files}
      stage_fixed: true
    # A `// TEMP-SIM` line forces a result for a Simulator run (see run-ios); it never ships.
    temp-sim:
      run: "! git diff --cached -U0 -- apps packages | grep -E '^\\+.*TEMP-SIM'"

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}
