<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast Panic</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:#18151b;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 20px;gap:12px;text-align:center;background-image:radial-gradient(#0001 2px,transparent 2px);background-size:22px 22px}header{width:100%;display:flex;justify-content:space-between;font-size:11px;font-weight:900;letter-spacing:1px}h1{font-size:clamp(32px,9vw,56px);line-height:.95;margin:0;font-weight:1000;letter-spacing:-2px;text-transform:uppercase}p{margin:0;font-size:13px;font-weight:600}button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}button:focus-visible{outline:4px solid #282071;outline-offset:4px}#action{border:3px solid #18151b;border-radius:14px;background:white;box-shadow:0 5px 0 #18151b;min-height:52px;min-width:180px;padding:12px 24px;font-weight:900;font-size:18px}#action:active{transform:translateY(4px);box-shadow:0 1px 0 #18151b}.stage{flex:1;min-height:100px;width:100%;position:relative;display:flex;align-items:center;justify-content:center}#message{min-height:35px;font-weight:800}progress{width:100%;height:12px;accent-color:#18151b}footer{font-size:10px;font-weight:800;letter-spacing:1px}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}body{--bg:#ffc54d}.toaster{width:180px;height:115px;background:#ff624c;border:5px solid #18151b;border-radius:26px 26px 15px 15px;position:relative;box-shadow:9px 9px 0 #18151b}.toaster:before{content:'';position:absolute;left:18px;right:18px;top:-13px;height:19px;background:#18151b;border-radius:50%}.toaster span{display:block;margin-top:45px;font-size:25px;font-weight:1000;transform:rotate(-8deg)}#toast{position:absolute;font-size:95px;top:50%;transform:translateY(-40%);transition:transform .12s;line-height:1}body.popped #toast{transform:translateY(-160%) rotate(-12deg)}</style></head><body><main><header><span>MICRO / 01</span><span>REACTION · 5 SEC</span></header><h1 id="command">Catch it!</h1><p>Wait for the toast. Then hit CATCH!</p><div class="stage"><div id="toast" aria-hidden="true">🍞</div><div class="toaster" aria-hidden="true"><span>HOT!</span></div></div><p id="message" role="status" aria-live="polite">Breakfast waits for nobody.</p><progress id="timer" value="5" max="5" aria-label="Time remaining"></progress><button id="action">Start</button><footer>CLICK / TAP / SPACE</footer></main><script>const action=document.querySelector('#action'),message=document.querySelector('#message'),command=document.querySelector('#command'),timer=document.querySelector('#timer');
let state='idle',started=0,popAt=0,loop;
function finish(win,text){state='done';clearInterval(loop);command.textContent=win?'Nice catch!':'Too slow!';message.textContent=text;action.textContent='Again';}
function tick(){const elapsed=performance.now()-started;timer.value=Math.max(0,5-elapsed/1000);if(state==='waiting'&&elapsed>=popAt){state='popped';document.body.classList.add('popped');command.textContent='CATCH!';message.textContent='NOW!';}if(state==='popped'&&elapsed>=popAt+850)finish(false,'The toast escaped. Try again!');}
function act(){if(state==='idle'||state==='done'){clearInterval(loop);document.body.classList.remove('popped');state='waiting';started=performance.now();popAt=1500+Math.random()*1800;timer.value=5;command.textContent='Wait…';message.textContent='Don’t catch too early!';action.textContent='CATCH!';loop=setInterval(tick,16);return;}tick();if(state==='popped'){finish(true,'Breakfast saved. Perfect timing!');}else if(state==='waiting'){finish(false,'Too early! Wait until the toast pops.');command.textContent='Too early!';}}
action.addEventListener('click',act);document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target!==action){e.preventDefault();if(!e.repeat)act();}});
</script></body></html>
