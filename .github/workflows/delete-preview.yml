# A branch's Worker Preview goes with the branch (merged PRs delete theirs). `wrangler preview delete` drops the Preview
# and its Durable Objects but leaves its container app, `hopon_<slug>_<class>`, so that's deleted by name too. Needs the
# CLOUDFLARE_API_TOKEN repository secret, as deploy.yml.
name: Delete Preview

on: delete

permissions:
  contents: read

jobs:
  delete:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ${{ github.event.ref }}
      CLOUDFLARE_ACCOUNT_ID: 51a5a41f7bd8425703a6f1d92f867f4d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/worker
        run: |
          npx wrangler preview delete --name "$BRANCH" --skip-confirmation || echo "no Preview for $BRANCH"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" |
            jq -r --arg prefix "hopon_${BRANCH//\//-}_" '.result[] | select(.name | startswith($prefix)) | .id' |
            while read -r id; do npx wrangler containers delete "$id"; done
