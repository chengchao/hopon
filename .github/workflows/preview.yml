# A Worker Preview of hopon for every branch but main (`pnpm run deploy:preview`; production stays on Workers Builds).
# It runs here, not in Workers Builds, because Workers Builds has Docker only on the production branch and a Preview
# builds the Coder's container image. The Preview's name is the branch, and its URL is in the log. Needs the
# CLOUDFLARE_API_TOKEN (Workers Scripts, D1 and Containers Edit) and E2B_API_KEY repository secrets.
name: Preview

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - "apps/mobile/**"
      - "docs/**"

permissions:
  contents: read

# One deploy per branch at a time; a newer push waits rather than cutting a deploy off halfway.
concurrency: preview-${{ github.ref_name }}

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy:preview
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
