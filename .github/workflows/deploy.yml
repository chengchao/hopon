# Every deploy of hopon: main is production (`pnpm run deploy`), and every other branch gets a Worker Preview of its
# own (`pnpm run deploy:preview`, named after the branch, its URL in the log). Both build the Coder's container image,
# so they run here: Workers Builds had no Docker, and its production deploy failed after it had migrated D1. Needs the
# CLOUDFLARE_API_TOKEN (Workers Scripts, D1, Containers and R2 Edit) and E2B_API_KEY repository secrets.
name: Deploy

on:
  push:
    paths-ignore:
      - "apps/mobile/**"
      - "docs/**"

permissions:
  contents: read

# One deploy per branch at a time; a newer push waits rather than cutting a deploy off halfway.
concurrency: deploy-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ github.ref_name == 'main' && 'deploy' || 'deploy:preview' }}
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
